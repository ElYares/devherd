services:
  redis:
    image: redis:7-alpine
    container_name: infra_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      infra_net:
        aliases:
          - redis
    labels:
      devherd.managed: "true"
      devherd.role: "shared-service"
      devherd.service: "redis"

  mailpit:
    image: axllent/mailpit:v1.31.0
    container_name: infra_mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      infra_net:
        aliases:
          - mailpit
    labels:
      devherd.managed: "true"
      devherd.role: "shared-service"
      devherd.service: "mailpit"

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: infra_prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Una semana. Es un entorno de desarrollo: retencion larga seria disco
      # gastado en datos que nadie va a mirar.
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      # Relativo al compose, que vive en el mismo directorio donde DevHerd escribe
      # la configuracion administrada.
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      infra_net:
        aliases:
          - prometheus
    labels:
      devherd.managed: "true"
      devherd.role: "shared-service"
      devherd.service: "prometheus"

  grafana:
    image: grafana/grafana:11.5.1
    container_name: infra_grafana
    restart: unless-stopped
    environment:
      # Acceso anonimo con rol de editor: es un entorno local, y un login que
      # nadie recuerda es friccion sin seguridad. El puerto solo escucha en
      # loopback, asi que no hay superficie que proteger.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Editor"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: "dark"
      # Abre directo en el tablero de DevHerd en vez de en una pagina vacia.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/etc/grafana/provisioning/dashboards/devherd/devherd-observe.json"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      infra_net:
        aliases:
          - grafana
    labels:
      devherd.managed: "true"
      devherd.role: "shared-service"
      devherd.service: "grafana"

volumes:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  infra_net:
    external: true
