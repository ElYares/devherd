name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: build
        run: make build

      - name: test (race + coverage)
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -n 1

  # Las plantillas PHP se escriben dentro de proyectos ajenos. Un error de
  # sintaxis no lo detecta ningun test de Go —comprueban que el archivo se
  # escribe, no que sea PHP valido— y llegaria al proyecto del usuario.
  php-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - name: php -l
        run: |
          find templates -name '*.php' -print0 | xargs -0 -r -n1 php -l

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          # v8 es la primera serie de la accion que instala golangci-lint v2,
          # la unica que entiende este .golangci.yml y un go.mod con go 1.25.
          version: v2.12.2
